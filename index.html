<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
</head>
<body>
    <style>
        html,body{height:100%;margin:0}
        .f1{display:block;width:100%;height:85vh;object-fit:contain;background:#f5f5f7}
        .f1-wrap{height:85vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
        .f1 img{max-height:100%;max-width:100%;display:block}
        .f2{display:block;width:100%;height:auto}
        .f2 img{width:100%;height:auto;display:block}
        .container{max-width:100%;margin:0}
    </style>

    <div class="container">
        <div class="f1-wrap" id="f1wrap">
            <img id="f1" alt="first image (covers 85% height)">
        </div>
        <div class="f2" id="f2wrap">
            <img id="f2" alt="second image (full width)">
        </div>
    </div>

<script>
    (function(){
        const params = new URLSearchParams(location.search);
        // Accept f1 and f2 parameters, otherwise try some sensible defaults
        const f1 = params.get('f1') || 'f1.png' ;
        const f2 = params.get('f2') || 'f2.png' ;
        const img1 = document.getElementById('f1');
        const img2 = document.getElementById('f2');

        function setSrc(img, src){
            img.src = src;
            img.addEventListener('error', ()=>{
                img.style.display = 'none';
            });
            img.addEventListener('click', ()=>{
                try{ window.open(src, '_blank'); }catch(e){}
            });
        }

        setSrc(img1, f1);
        setSrc(img2, f2);
    })();
</script>
</body>
</html>
